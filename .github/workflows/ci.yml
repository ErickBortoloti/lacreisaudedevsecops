name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:

    runs-on: ubuntu-latest
    steps:
      - name: Baixar cod
        uses: actions/checkout@v4
      
      - name: Config python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Testar
        run: pytest
      
      - name: Build image
        run: docker build -t lacreisaudeapi:ci .

      - name: Subir API
        run: docker run -d --name lacreisaude-api -p 8000:8000 lacreisaudeapi:ci

      - name: Valida API
        run: |
          for i in {1..5}; do
            if curl --fail http://localhost:8000/status; then
              exit 0
            fi
            echo "API está subindo - Tentativa $i..."
            sleep 5 
          done

          echo "API não ficou disponível :c"
          docker logs lacreisaude-api
          exit 1
      
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000"
          allow_issue_writing: false
          artifact_name: "zap-report"
      
      - name: Autenticar GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Publicar no Artifact Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="us-east1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lacreisaude/lacreisaudeapi"

          docker tag lacreisaudeapi:ci "$IMAGE:${{ github.sha }}"
          docker tag lacreisaudeapi:ci "$IMAGE:latest"

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      
      - name: Logar dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag lacreisaudeapi:ci ${{ secrets.DOCKER_HUB_USER }}/lacreisaudeapi:latest
          docker push ${{ secrets.DOCKER_HUB_USER }}/lacreisaudeapi:latest